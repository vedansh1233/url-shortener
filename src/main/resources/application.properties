spring.application.name=url-shortener
server.port=${PORT:8081}

# Embedded H2 file database by default: works with zero setup, data kept in ./data.
# For PostgreSQL set DB_URL=jdbc:postgresql://localhost:5432/shortener plus DB_USERNAME / DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/shortener;MODE=PostgreSQL;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html
